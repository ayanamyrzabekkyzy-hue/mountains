<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiking</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gasoek+One&family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/core.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/all.css">
    <link rel="stylesheet" href="../css/hiking.css">

    
</head>
<body>
    <div class="wrapper">
        <div class="header hiking">
            <div class="container">
                <div class="inner_header">
                    <a href="../pages/main.html">Home</a>
                    <a href="../pages/peaks.html">Peaks</a>
                    <a class="active" href="../pages/hiking.html">Hiking</a>
                    <a href="../pages/equipment.html">Equipment</a>
                    <button class="btn" id="btn-get">Contact</button>
                </div>
            </div>
        </div>
        <div class="routes">
            <div class="routes_inner">
                <div class="routes_title">
                    <h2>routes</h2>
                </div>
                <div class="container">
                    <div class="block_routes">
                        
                    </div>
                </div>
            </div>
        </div>
       
        <div class="slider_block_hiking">
            <div class="container">
                <div class="inner_slider">
                    <div class="slider_pic">
                        
                    </div>
                </div>
            </div>
        </div>
        
        <div class="move_block">
            <div class="container">
                <h3>YOUR HIKING </h3>
                <div class="inner_move_block">
                    <div class="parent_block">
                        <div class="label go">GO</div>
                        <div class="label break">BREAK</div>
                        <div class="label go1">BREAK</div>
                        <div class="label break1">GO</div>
                        <div class="child_block"></div>
                    </div>
                </div>
            </div>
        </div>
    
        <div class="footer">
            <div class="container">
                <div class="inner_footer">
                    <a href="https://www.instagram.com/nacreouspan/" target="_blank"><i class="fa-brands fa-instagram"></i></a>
                    <a href="https://t.me/ayanazw" target="_blank"><i class="fa-brands fa-telegram"></i></a>
                </div>
            </div>
        </div>  
    </div>
    
    <div class="modal">
        <div class="modal_dialog">
            <div class="modal_content">
                <form action="#">
                    <div class="modal_close">&#10006;</div>
                    <div class="modal_title">Запланируй свой хайкинг!</div>
                    <label>
                        <input
                            required
                            placeholder="Ваше имя"
                            name="name"
                            type="text"
                            class="modal_input"
                        >
                    </label>
                    <label>
                        <input
                            required
                            placeholder="Ваш номер телефона"
                            name="phone"
                            type="text"
                            class="modal_input"
                        >
                    </label>
                    <button class="btn btn_dark btn_min">Перезвонить мне</button>
                </form>
            </div>
        </div>
    </div> 
</body>
<script src="../js/main.js"></script>
<script src="../js/modal.js"></script>
<script src="../js/hiking.js"></script>
</html>
